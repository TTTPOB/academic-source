# Adapted from ~/playground/jcli; legacy modules migrate separately.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        args: [--fix]
        language: system
        types_or: [python, pyi]
        files: ^(src/academic_source/|tests/academic_source/|tests/providers/)
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(src/academic_source/|tests/academic_source/|tests/providers/)
        require_serial: true
      - id: pyrefly-check
        name: pyrefly check
        entry: uv run --frozen pyrefly check
        language: system
        types_or: [python, pyi]
        files: ^(src/academic_source/|tests/academic_source/|tests/providers/)
        pass_filenames: false
        require_serial: true
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
