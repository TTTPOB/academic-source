name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra server --extra vpnsci --extra fast
      - run: uv run --frozen ruff check src/academic_source tests/academic_source tests/providers
      - run: uv run --frozen ruff format --check src/academic_source tests/academic_source tests/providers
      - run: >-
          uv run --frozen ruff check --select E4,E7,E9,F
          src/scansci_pdf/identifiers.py
          src/scansci_pdf/queue.py
          src/scansci_pdf/publisher_strategies/registry.py
          src/scansci_pdf/publisher_profiles.py
          src/scansci_pdf/publisher_pdf_router.py
          src/scansci_pdf/sources/publishers.py
      - run: uv run --frozen pyrefly check
      - run: uv run --frozen pytest -q --tb=short

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
      - run: uv venv "$RUNNER_TEMP/wheel-env" --python 3.13
      - run: |
          for wheel in "$RUNNER_TEMP"/wheels/*.whl; do
            uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" "academic-source[server,cdp] @ file://$wheel"
          done
      - run: |
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/tests/academic_source/test_installation.py" --cdp
        working-directory: ${{ runner.temp }}
      # The default installation is the client alone: it must start without the server extra.
      - run: |
          uv venv "$RUNNER_TEMP/client-env" --python 3.13
          for wheel in "$RUNNER_TEMP"/wheels/*.whl; do
            uv pip install --python "$RUNNER_TEMP/client-env/bin/python" "$wheel"
          done
          "$RUNNER_TEMP/client-env/bin/asource" --help
          if "$RUNNER_TEMP/client-env/bin/python" -c "import pydantic"; then exit 1; fi
          "$RUNNER_TEMP/client-env/bin/asource" serve 2>&1 | grep -F "academic-source[server]"
        working-directory: ${{ runner.temp }}
