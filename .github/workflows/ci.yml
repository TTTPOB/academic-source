name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra vpnsci --extra fast
      - run: uv run --frozen ruff check src/academic_source tests/academic_source tests/providers
      - run: uv run --frozen ruff format --check src/academic_source tests/academic_source tests/providers
      - run: uv run --frozen pyrefly check
      - run: uv run --frozen pytest -q --tb=short
