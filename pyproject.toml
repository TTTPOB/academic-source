[project]
name = "academic-source"
version = "0.1.0"
description = "Academic resource acquisition through a unified HTTP, MCP, and CLI application"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "requests[socks]>=2.31",
    "urllib3>=2.7.0",
    "beautifulsoup4>=4.12",
    "mcp>=1.27,<2",
    "pydantic>=2.11",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34",
    "fastapi>=0.115",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
fast = ["lxml>=4.9"]
vpnsci = ["pycryptodome>=3.20"]
cloakbrowser = ["cloakbrowser>=0.5.9"]
camoufox = ["camoufox[geoip]>=0.4.11"]
patchright = ["patchright>=1.61"]
cdp = ["playwright>=1.63,<2"]

[tool.uv]
conflicts = [[{ extra = "cdp" }, { extra = "camoufox" }]]

[project.scripts]
academic-source = "academic_source.interfaces.cli:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scansci_pdf = ["data/*.json"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15", "pyrefly>=0.50", "pre-commit>=4.0"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/scansci_pdf", "scripts"]

[tool.pyrefly]
preset = "basic"
project-includes = ["src/academic_source/**/*.py"]

[tool.pytest.ini_options]
# Manual network/browser scripts in the repo root (e.g. test_download_pnas.py)
# must not be collected as tests.
testpaths = ["tests/academic_source", "tests/providers"]
